  <style>
    :root{
      --azul:#0324FC;
      --azul-osc:#011174;
      --cian:#5DEBFD;
      --bg:#f0f4ff;
      --panel:#ffffff;
      --text:#1a1a2e;
      --muted:#555555;
      --border:#e2e8f0;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',sans-serif}
    body{display:flex;height:100vh;background:var(--bg);overflow:hidden}
    #sidebar{
      width:380px;background:var(--panel);box-shadow:4px 0 15px rgba(0,0,0,.05);
      display:flex;flex-direction:column;z-index:1000;border-right:1px solid var(--border)
    }
    .header-panel{
      padding:24px;background:linear-gradient(135deg,var(--azul-osc),var(--azul));color:#fff
    }
    .header-panel h1{font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px}
    .header-panel p{font-size:12px;opacity:.8}
    .stats-container{
      padding:12px 24px;background:#f8fafc;border-bottom:1px solid var(--border);
      display:flex;justify-content:space-between;align-items:center
    }
    .counter-badge{
      background:var(--azul);color:#fff;padding:4px 10px;border-radius:20px;
      font-size:12px;font-weight:600
    }
    .filters-body{
      padding:24px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px
    }
    .filter-group{display:flex;flex-direction:column;gap:6px}
    .filter-group label{
      font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.5px
    }
    .input-search,.select-filter{
      width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;
      font-size:13px;color:var(--text);background:#fff;transition:.2s ease
    }
    .input-search:focus,.select-filter:focus{
      outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(3,36,252,.1)
    }
    .btn-reset{
      background:#f1f5f9;color:#475569;border:none;padding:12px;border-radius:8px;
      font-size:13px;font-weight:600;cursor:pointer;transition:.2s ease;margin-top:auto
    }
    .btn-reset:hover{background:#e2e8f0}
    #map{flex:1;height:100%;position:relative}
    .popup-header{border-bottom:2px solid var(--azul);padding-bottom:6px;margin-bottom:8px}
    .popup-header .nombre{font-weight:700;font-size:14px;color:var(--azul-osc)}
    .popup-header .nom-corto{font-size:11px;color:var(--muted);margin-top:2px}
    .popup-body{display:flex;flex-direction:column;gap:4px;font-size:12px;min-width:240px}
    .popup-row{display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9;padding:3px 0}
    .popup-lbl{font-weight:600;color:#64748b}
    .tag{
      padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase
    }
    .tag-Inicial{background:#fee2e2;color:#ef4444}
    .tag-Primaria{background:#fef3c7;color:#d97706}
    .tag-Secundaria{background:#dbeafe;color:#2563eb}
    .tag-Superior{background:#e0f2fe;color:#0284c7}
    .tag-Especial{background:#f3e8ff;color:#9333ea}
    .tag-Otro{background:#f1f5f9;color:#475569}
    .leaflet-control-layers{border-radius:10px;overflow:hidden}
  </style>
</head>

        </select>
      </div>

      <button class="btn-reset" onclick="resetFilters()">Restablecer Filtros</button>
    </div>
  </div>

function clean(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/\s+/g,' ').trim();
}

function norm(v){
  return clean(v).toUpperCase();
}

function splitCoords(txt){
  const m = clean(txt).match(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/);
  if(!m) return null;
  const lng = parseFloat(m[1]);
  const lat = parseFloat(m[2]);
  if(!isFinite(lat) || !isFinite(lng)) return null;
  return [lat, lng];
}

function getProps(f){
  return f && f.properties ? f.properties : {};
}

function inferNivel(text){
  const t = norm(text);
  if(t.includes('JARDIN') || t.includes('INICIAL') || t.includes('MATERNAL')) return 'Inicial';
  if(t.includes('PRIMARIA') || t.includes('PRIMARIO')) return 'Primaria';
  if(t.includes('SECUNDARIA') || t.includes('SECUNDARIO')) return 'Secundaria';
  if(t.includes('SUPERIOR') || t.includes('TERCIARIO') || t.includes('PROFESORADO') || t.includes('TECNICO') || t.includes('TÉCNICO')) return 'Superior';
  if(t.includes('SNU') || t.includes('COMUN - SNU')) return 'SNU';
  return 'Otro';
}

function inferValue(obj, keys){
  for(const k of keys){
    if(obj[k] !== undefined && clean(obj[k]) !== '') return clean(obj[k]);
  }
  return '';
}

function normalizeFeature(f){
  const p = getProps(f);

  const coords = splitCoords(inferValue(p, ['Coordenadas','coordenadas']));
  if(!coords) return null;

  const establecimiento = inferValue(p, ['Establecimiento','establecimiento']);
  const cue = inferValue(p, ['Cue','CUE','cue']);
  const domicilio = inferValue(p, ['Domicilio Ppal.','Domicilio','domicilio']);
  let telefono = inferValue(p, ['Telefono','Teléfono','telefono']);
  let email = inferValue(p, ['Email','email']);
  let ambito = inferValue(p, ['Ambito','Ámbito','ambito']);
  let sector = inferValue(p, ['Sector','sector']);
  let periodo = inferValue(p, ['Periodo de Func.','Periodo','periodo']);
  let modalidad = inferValue(p, ['Modalidad - Oferta Tipo','Modalidad','oferta','tipo']);
  let localidad = inferValue(p, ['Localidad','localidad']);
  let departamento = inferValue(p, ['Departamento','departamento']);
  let region = inferValue(p, ['Region Educativa','Región Educativa','region']);
  let nombreCorto = inferValue(p, ['Establec.','Establecimiento Corto','nombre_corto']);

  const nivel = inferNivel(modalidad || establecimiento);

  if(norm(ambito).includes('URBANO') || norm(ambito).includes('RURAL') || norm(ambito).includes('DISPERSO') || norm(ambito).includes('AGLOMERADO')) {
  } else {
    const tokens = [sector, periodo, localidad, departamento, region, modalidad, email, telefono];
    const fallbackAmbito = tokens.find(t => /URBANO|RURAL|DISPERSO|AGLOMERADO/i.test(t));
    if(fallbackAmbito) ambito = fallbackAmbito;
  }

  if(!departamento && norm(localidad) === 'SAN SALVADOR DE JUJUY') departamento = 'DOCTOR MANUEL BELGRANO';

  return {
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [coords[1], coords[0]] },
    properties: {
      establecimiento,
      nombreCorto,
      cue,
      domicilio,
      telefono,
      email,
      ambito,
      sector,
      periodo,
      modalidad,
      localidad,
      departamento,
      region,
      nivel
    }
  };
}

  type: 'FeatureCollection',

    attribution: '&copy; Esri'
  }),
  'Esri Topográfico': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: '&copy; Esri'
  })
};

baseLayers['OpenStreetMap'].addTo(map);

const markerCluster = L.markerClusterGroup({
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  disableClusteringAtZoom: 17
});

const allMarkers = [];

function tagNivel(n){
  return `<span class="tag tag-${n || 'Otro'}">${n || 'Otro'}</span>`;
}

function popupHtml(p){
  return `
    <div class="popup-header">
      <div class="nombre">${p.establecimiento || 'Sin nombre'}</div>
      <div class="nom-corto">${p.nombreCorto || ''}</div>
    </div>
    <div class="popup-body">
      <div class="popup-row"><span class="popup-lbl">CUE</span><span>${p.cue || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Nivel</span><span>${tagNivel(p.nivel)}</span></div>
      <div class="popup-row"><span class="popup-lbl">Departamento</span><span>${p.departamento || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Región</span><span>${p.region || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Localidad</span><span>${p.localidad || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Ámbito</span><span>${p.ambito || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Sector</span><span>${p.sector || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Período</span><span>${p.periodo || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Oferta</span><span>${p.modalidad || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Domicilio</span><span>${p.domicilio || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Teléfono</span><span>${p.telefono || '-'}</span></div>
      <div class="popup-row"><span class="popup-lbl">Email</span><span>${p.email || '-'}</span></div>
    </div>
  `;
}

function fillSelect(selectId, values){
  const sel = document.getElementById(selectId);
  const keep = sel.querySelector('option[value=""]');
  sel.innerHTML = '';
  sel.appendChild(keep);
  [...values].sort((a,b)=>a.localeCompare(b,'es')).forEach(v=>{
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    sel.appendChild(o);
  });
}

function getUnique(field){
  return [...new Set(data.features.map(f => clean(f.properties[field])).filter(Boolean))];
}

function buildFilters(){
  fillSelect('select-departamento', getUnique('departamento'));
  fillSelect('select-region', getUnique('region'));
  fillSelect('select-modalidad', getUnique('modalidad'));
  fillSelect('select-ambito', getUnique('ambito'));
  fillSelect('select-sector', getUnique('sector'));
  fillSelect('select-periodo', getUnique('periodo'));
}

function matchText(a,b){
  if(!b) return true;
  return norm(a).includes(norm(b));
}

function applyFilters(){
  const q = norm(document.getElementById('input-search').value);
  const d = document.getElementById('select-departamento').value;
  const r = document.getElementById('select-region').value;
  
  const m = document.getElementById('select-modalidad').value;
  const a = document.getElementById('select-ambito').value;
  const s = document.getElementById('select-sector').value;
  const p = document.getElementById('select-periodo').value;

  markerCluster.clearLayers();

  let visible = 0;

  allMarkers.forEach(item => {
    const pr = item.feature.properties;
    const ok =
      (!q || [pr.establecimiento, pr.cue, pr.localidad, pr.domicilio].some(v => norm(v).includes(q))) &&
      (!d || pr.departamento === d) &&
      (!r || pr.region === r) &&
      
      (!m || pr.modalidad === m) &&
      (!a || pr.ambito === a) &&
      (!s || pr.sector === s) &&
      (!p || pr.periodo === p);

    if(ok){
      markerCluster.addLayer(item.marker);
      visible++;
    }
  });

  document.getElementById('total-badge').textContent = visible.toLocaleString('es-AR');
}

function resetFilters(){
  document.getElementById('input-search').value = '';
  document.getElementById('select-departamento').value = '';
  document.getElementById('select-region').value = '';
  
  document.getElementById('select-modalidad').value = '';
  document.getElementById('select-ambito').value = '';
  document.getElementById('select-sector').value = '';
  document.getElementById('select-periodo').value = '';
  applyFilters();
}

function markerColor(nivel){
  switch(nivel){
    case 'Inicial': return '#ef4444';
    case 'Primaria': return '#f59e0b';
    case 'Secundaria': return '#2563eb';
    case 'Superior': return '#0284c7';
    case 'SNU': return '#7c3aed';
    default: return '#64748b';
  }
}

function createIcon(nivel){
  const color = markerColor(nivel);
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.12)"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8]
  });
}

data.features.forEach(feature => {
  const p = feature.properties;
  const marker = L.marker([feature.geometry.coordinates[1], feature.geometry.coordinates[0]], {
    icon: createIcon(p.nivel)
  }).bindPopup(popupHtml(p), { maxWidth: 360 });

  allMarkers.push({ marker, feature });
});

map.addLayer(markerCluster);
buildFilters();
applyFilters();

document.getElementById('input-search').addEventListener('input', applyFilters);
document.getElementById('select-departamento').addEventListener('change', applyFilters);
document.getElementById('select-region').addEventListener('change', applyFilters);

document.getElementById('select-modalidad').addEventListener('change', applyFilters);
document.getElementById('select-ambito').addEventListener('change', applyFilters);
document.getElementById('select-sector').addEventListener('change', applyFilters);
document.getElementById('select-periodo').addEventListener('change', applyFilters);

L.control.layers(baseLayers, null, { collapsed: false }).addTo(map);

const group = L.featureGroup(allMarkers.map(x => x.marker));
if(allMarkers.length > 0){
  map.fitBounds(group.getBounds().pad(0.08));
} else {
  map.setView([-23.8, -65.3], 8);
}
</script>
</body>
</html>
